<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Welcome Back</h2>
        <p class="subtitle">Please log in to continue</p>

        <!-- success and error messages -->
        <div id="successMsg" class="success-msg" style="display:none;"></div>
        <div id="errorMsg" class="error-msg" style="display:none;"></div>

        <form id="loginForm">

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" />
                <span class="field-error" id="usernameError"></span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" />
                <span class="field-error" id="passwordError"></span>
            </div>

            <div class="btn-group">
                <button type="submit" id="loginBtn">Login</button>
                <button type="reset" id="resetBtn" onclick="resetForm()">Reset</button>
            </div>

        </form>

        <p class="footer-text">Don't have an account? <a href="#">Sign up</a></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
